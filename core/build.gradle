dependencies {
    compileOnly "org.spigotmc:spigot:$spigotVersion"
    compileOnly "net.kyori:adventure-api:$adventureVersion"
    compileOnly "net.kyori:adventure-text-serializer-legacy:$adventureVersion"
    compileOnly "net.kyori:adventure-text-serializer-gson:$adventureVersion"
    implementation "com.github.hamza-cskn:obliviate-utils:$obliviateUtilsVersion"
    implementation "com.github.Anon8281:UniversalScheduler:$universalSchedulerVersion"

    testImplementation "org.spigotmc:spigot:$spigotVersion"
    testImplementation "net.kyori:adventure-api:$adventureVersion"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-inline:4.11.0'
}
